services:
  - type: web
    name: bitget-webhook-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_SECRET
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: WEBHOOK_PASSPHRASE
        sync: false
      - key: USE_TESTNET
        value: "false"
